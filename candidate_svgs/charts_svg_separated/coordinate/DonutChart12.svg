<svg id="chart-donut" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" tabindex="0" viewBox="0 0 500 484"><style>
    svg {
      font-family: "Open Sans", Arial, sans-serif;
      font-size: 15px
    }

    #fizz_chart_frame {
      fill: none;
      stroke: none
    }

    .radial_label_right {
      text-anchor: start
    }

    .radial_label_left {
      text-anchor: end
    }

    .datapoint_background {
      fill: none;
      stroke: none;
      pointer-events: all;
      outline: none
    }

    .data_line {
      fill: none;
      stroke: hsl(270, 50%, 50%);
      stroke-width: 3px;
      stroke-linecap: round
    }

    .data_area {
      stroke: hsl(270, 50%, 50%);
      stroke-width: 3px;
      stroke-linecap: round;
      fill: none
    }

    .data_area_background {
      stroke: none;
      fill: hsl(270, 50%, 50%);
      fill-opacity: 0.8
    }

    tspan.subtext {
      font-size: 2rem;
      text-anchor: middle
    }

    .chart_title {
      font-size: 18px;
      text-anchor: middle;
      fill: black;
    }

    .radial_label {
      fill: black;
      stroke: none;
      text-anchor: middle;
      font-size: 13px;
    }

    .series_0 {
      fill: hsl(312, 100%, 31%);
      stroke: hsl(312, 100%, 31%);
    }

    .series_1 {
      fill: hsl(176, 82%, 38%);
      stroke: hsl(176, 82%, 38%);
    }

    .series_2 {
      fill: hsl(78, 100%, 37%);
      stroke: hsl(78, 100%, 37%);
    }

    .series_3 {
      fill: hsl(358, 100%, 73%);
      stroke: hsl(358, 100%, 73%);
    }
  </style></svg>
